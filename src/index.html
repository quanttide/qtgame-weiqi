<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>墨弈 · 围棋</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0f0a07;
                --bg-2: #1a1209;
                --board: #d4a76a;
                --board-dark: #b8894a;
                --line: rgba(30, 20, 10, 0.85);
                --accent: #c93838;
                --gold: #d4a020;
                --jade: #6b8e4e;
                --fg: #e8d9c0;
                --muted: #8a7960;
            }

            * {
                box-sizing: border-box;
            }

            body {
                font-family: "Noto Sans SC", sans-serif;
                background: var(--bg);
                color: var(--fg);
                min-height: 100vh;
                overflow-x: hidden;
                margin: 0;
            }

            .display-font {
                font-family: "ZCOOL XiaoWei", serif;
            }

            /* 整体氛围背景 */
            .bg-texture {
                background:
                    radial-gradient(
                        ellipse at 20% 0%,
                        rgba(212, 167, 106, 0.1),
                        transparent 50%
                    ),
                    radial-gradient(
                        ellipse at 80% 100%,
                        rgba(201, 56, 56, 0.08),
                        transparent 50%
                    ),
                    radial-gradient(
                        ellipse at 50% 50%,
                        rgba(107, 142, 78, 0.04),
                        transparent 70%
                    ),
                    linear-gradient(
                        180deg,
                        #0f0a07 0%,
                        #15100a 50%,
                        #1a1209 100%
                    );
                position: relative;
            }

            /* 浮动墨晕 */
            .ink-blob {
                position: fixed;
                border-radius: 50%;
                filter: blur(80px);
                opacity: 0.18;
                pointer-events: none;
                z-index: 0;
            }
            .ink-blob.b1 {
                width: 500px;
                height: 500px;
                background: #c93838;
                top: -120px;
                left: -120px;
                animation: float1 18s ease-in-out infinite;
            }
            .ink-blob.b2 {
                width: 400px;
                height: 400px;
                background: #d4a020;
                bottom: -80px;
                right: -80px;
                animation: float2 22s ease-in-out infinite;
            }
            .ink-blob.b3 {
                width: 300px;
                height: 300px;
                background: #6b8e4e;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                opacity: 0.08;
                animation: float3 25s ease-in-out infinite;
            }
            @keyframes float1 {
                0%,
                100% {
                    transform: translate(0, 0) scale(1);
                }
                50% {
                    transform: translate(60px, 40px) scale(1.15);
                }
            }
            @keyframes float2 {
                0%,
                100% {
                    transform: translate(0, 0) scale(1);
                }
                50% {
                    transform: translate(-40px, -50px) scale(0.9);
                }
            }
            @keyframes float3 {
                0%,
                100% {
                    transform: translate(-50%, -50%) scale(1);
                }
                50% {
                    transform: translate(-40%, -55%) scale(1.2);
                }
            }

            /* 棋盘容器 */
            .board-wrap {
                position: relative;
                background:
                    radial-gradient(
                        ellipse at 30% 20%,
                        #e0b378 0%,
                        transparent 60%
                    ),
                    linear-gradient(
                        135deg,
                        #d4a76a 0%,
                        #c8954d 50%,
                        #b0823c 100%
                    );
                border-radius: 10px;
                box-shadow:
                    0 30px 80px -20px rgba(0, 0, 0, 0.8),
                    0 0 0 1px rgba(80, 50, 20, 0.6),
                    inset 0 2px 0 rgba(255, 230, 180, 0.35),
                    inset 0 -2px 0 rgba(60, 30, 10, 0.4);
                padding: 18px;
                width: 100%;
                max-width: 720px;
                aspect-ratio: 1;
            }

            .board-wrap::before {
                content: "";
                position: absolute;
                inset: 6px;
                border-radius: 6px;
                border: 1px solid rgba(60, 30, 10, 0.25);
                pointer-events: none;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
                cursor: crosshair;
                position: relative;
                z-index: 1;
            }

            /* 面板 */
            .panel {
                background: linear-gradient(
                    180deg,
                    rgba(26, 18, 9, 0.7),
                    rgba(15, 10, 7, 0.5)
                );
                border: 1px solid rgba(212, 167, 106, 0.18);
                backdrop-filter: blur(12px);
                border-radius: 14px;
                position: relative;
                overflow: hidden;
            }

            .panel::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(212, 167, 106, 0.4),
                    transparent
                );
            }

            /* 按钮 */
            .btn {
                background: linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.04),
                    rgba(0, 0, 0, 0.15)
                );
                border: 1px solid rgba(212, 167, 106, 0.22);
                color: var(--fg);
                padding: 10px 14px;
                border-radius: 7px;
                transition: all 0.2s;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                font-family: inherit;
                width: 100%;
            }
            .btn:hover {
                background: linear-gradient(
                    180deg,
                    rgba(212, 167, 106, 0.18),
                    rgba(212, 167, 106, 0.05)
                );
                border-color: rgba(212, 167, 106, 0.55);
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(212, 167, 106, 0.15);
            }
            .btn:active {
                transform: translateY(0);
            }

            .btn-primary {
                background: linear-gradient(180deg, #d04040, #a02828);
                border-color: rgba(201, 56, 56, 0.5);
                color: #ffeaea;
            }
            .btn-primary:hover {
                background: linear-gradient(180deg, #e05050, #b03030);
                border-color: rgba(201, 56, 56, 0.8);
                box-shadow: 0 4px 16px rgba(201, 56, 56, 0.3);
            }

            .size-btn.active {
                background: linear-gradient(
                    180deg,
                    rgba(212, 160, 32, 0.25),
                    rgba(212, 160, 32, 0.08)
                );
                border-color: rgba(212, 160, 32, 0.6);
                color: #ffd560;
                box-shadow:
                    inset 0 0 12px rgba(212, 160, 32, 0.15),
                    0 1px 0 rgba(212, 160, 32, 0.4);
            }

            /* 棋手指示器 */
            .player-indicator {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                position: relative;
                transition: all 0.3s;
                flex-shrink: 0;
            }
            .player-indicator.black {
                background: radial-gradient(
                    circle at 35% 28%,
                    #5a4530,
                    #1a1410 55%,
                    #000 100%
                );
                box-shadow:
                    0 4px 14px rgba(0, 0, 0, 0.7),
                    inset -3px -3px 6px rgba(0, 0, 0, 0.6),
                    inset 2px 2px 4px rgba(255, 255, 255, 0.08);
            }
            .player-indicator.white {
                background: radial-gradient(
                    circle at 35% 28%,
                    #ffffff,
                    #f0e4d0 50%,
                    #b8a888 100%
                );
                box-shadow:
                    0 4px 14px rgba(0, 0, 0, 0.4),
                    inset -3px -3px 6px rgba(120, 100, 70, 0.3),
                    inset 2px 2px 4px rgba(255, 255, 255, 0.6);
            }
            .player-indicator.active::after {
                content: "";
                position: absolute;
                inset: -8px;
                border-radius: 50%;
                border: 2px solid var(--accent);
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.4;
                    transform: scale(1.08);
                }
            }

            /* 统计块 */
            .stat-box {
                background: linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.4),
                    rgba(0, 0, 0, 0.2)
                );
                border: 1px solid rgba(212, 167, 106, 0.1);
                border-radius: 8px;
                padding: 10px 8px;
                text-align: center;
            }

            /* 棋谱标签 */
            .move-tag {
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                font-family: "Courier New", monospace;
                font-weight: 600;
                background: rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(212, 167, 106, 0.15);
                white-space: nowrap;
            }
            .move-tag.b {
                color: #ffd560;
                border-color: rgba(212, 160, 32, 0.3);
            }
            .move-tag.w {
                color: #f5ede0;
                border-color: rgba(245, 237, 224, 0.3);
            }

            /* 滚动条 */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.2);
            }
            ::-webkit-scrollbar-thumb {
                background: rgba(212, 167, 106, 0.35);
                border-radius: 3px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: rgba(212, 167, 106, 0.5);
            }

            kbd {
                background: rgba(212, 167, 106, 0.12);
                border: 1px solid rgba(212, 167, 106, 0.3);
                padding: 2px 7px;
                border-radius: 3px;
                font-family: "Courier New", monospace;
                font-size: 11px;
                color: #d4a76a;
                margin-right: 6px;
            }

            /* 顶部装饰线 */
            .ornament-line {
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(212, 167, 106, 0.4),
                    transparent
                );
            }

            /* 状态文字微动效 */
            .status-text {
                transition: all 0.3s;
            }

            /* Toast */
            .toast {
                position: fixed;
                top: 24px;
                left: 50%;
                transform: translateX(-50%) translateY(-20px);
                background: rgba(15, 10, 7, 0.95);
                color: var(--fg);
                padding: 12px 24px;
                border-radius: 8px;
                border: 1px solid rgba(212, 167, 106, 0.3);
                backdrop-filter: blur(10px);
                z-index: 1000;
                opacity: 0;
                transition: all 0.3s ease;
                font-size: 14px;
                letter-spacing: 0.05em;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            }
            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            .toast.error {
                border-color: rgba(201, 56, 56, 0.6);
                color: #ffb0b0;
            }
            .toast.success {
                border-color: rgba(107, 142, 78, 0.6);
                color: #c0e0a0;
            }
        </style>
    </head>
    <body class="bg-texture">
        <div class="ink-blob b1"></div>
        <div class="ink-blob b2"></div>
        <div class="ink-blob b3"></div>

        <main class="relative z-10 max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8">
            <!-- 标题区 -->
            <header class="flex items-center justify-between mb-5">
                <h1
                    class="display-font text-3xl md:text-4xl text-amber-100"
                    style="
                        letter-spacing: 0.12em;
                        text-shadow: 0 2px 20px rgba(212, 167, 106, 0.3);
                    "
                >
                    墨弈
                </h1>
                <div class="flex items-center gap-3 text-xs text-amber-200/50">
                    <span
                        >第
                        <span id="moveNum" class="text-amber-100 font-bold"
                            >0</span
                        >
                        手</span
                    >
                    <span class="text-amber-200/20">|</span>
                    <span
                        ><span id="sizeLabel" class="text-amber-100"
                            >19×19</span
                        ></span
                    >
                </div>
            </header>

            <div class="ornament-line mb-4 md:mb-5"></div>

            <!-- 两栏：棋盘 | 信息+控制+棋谱 -->
            <div class="grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-5">
                <!-- 左栏：棋盘 -->
                <div class="flex flex-col items-center order-1">
                    <div class="board-wrap">
                        <canvas id="board" width="720" height="720"></canvas>
                    </div>
                </div>

                <!-- 右栏：控制台 -->
                <aside class="flex flex-col gap-2.5 order-2">
                    <!-- 棋手状态（紧凑对比） -->
                    <div class="panel overflow-hidden">
                        <div class="grid grid-cols-2">
                            <div
                                class="p-3 border-r border-amber-200/10"
                                id="blackPanel"
                            >
                                <div class="flex items-center gap-1.5">
                                    <div
                                        id="blackIndicator"
                                        class="player-indicator black active !w-7 !h-7"
                                    ></div>
                                    <span
                                        class="display-font text-sm text-amber-100"
                                        >玄</span
                                    >
                                    <span
                                        class="text-[10px] text-amber-200/30 ml-auto"
                                        >黑</span
                                    >
                                </div>
                                <div class="flex gap-2.5 mt-1.5 text-xs">
                                    <span class="text-amber-200/40"
                                        >提
                                        <b
                                            id="blackCaptured"
                                            class="text-amber-100 font-bold"
                                            >0</b
                                        ></span
                                    >
                                    <span class="text-amber-200/40"
                                        >手
                                        <b
                                            id="blackMoves"
                                            class="text-amber-100 font-bold"
                                            >0</b
                                        ></span
                                    >
                                </div>
                            </div>
                            <div class="p-3" id="whitePanel">
                                <div class="flex items-center gap-1.5">
                                    <div
                                        id="whiteIndicator"
                                        class="player-indicator white !w-7 !h-7"
                                    ></div>
                                    <span
                                        class="display-font text-sm text-amber-100"
                                        >素</span
                                    >
                                    <span
                                        class="text-[10px] text-amber-200/30 ml-auto"
                                        >白</span
                                    >
                                </div>
                                <div class="flex gap-2.5 mt-1.5 text-xs">
                                    <span class="text-amber-200/40"
                                        >提
                                        <b
                                            id="whiteCaptured"
                                            class="text-amber-100 font-bold"
                                            >0</b
                                        ></span
                                    >
                                    <span class="text-amber-200/40"
                                        >手
                                        <b
                                            id="whiteMoves"
                                            class="text-amber-100 font-bold"
                                            >0</b
                                        ></span
                                    >
                                </div>
                            </div>
                        </div>
                        <div
                            class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-200/5 border-t border-amber-200/10 text-xs"
                        >
                            <span
                                id="currentDot"
                                class="w-1.5 h-1.5 rounded-full bg-amber-900"
                            ></span>
                            <span class="text-amber-200/50">当前</span>
                            <span
                                id="statusText"
                                class="text-amber-100 font-bold"
                                >黑方</span
                            >
                        </div>
                    </div>

                    <!-- 操作区：路数选择 → 开局 -->
                    <div class="panel p-3">
                        <div class="flex items-center justify-between">
                            <div class="flex gap-1">
                                <button
                                    class="btn size-btn !px-2.5 !py-1 text-xs"
                                    data-size="9"
                                >
                                    9
                                </button>
                                <button
                                    class="btn size-btn !px-2.5 !py-1 text-xs"
                                    data-size="13"
                                >
                                    13
                                </button>
                                <button
                                    class="btn size-btn !px-2.5 !py-1 text-xs active"
                                    data-size="19"
                                >
                                    19
                                </button>
                            </div>
                            <span class="text-[10px] text-amber-200/20"
                                >棋盘路数</span
                            >
                        </div>
                        <button
                            class="btn btn-primary w-full !py-1.5 text-sm mt-2"
                            id="newGameBtn"
                        >
                            开始新对局
                        </button>
                    </div>

                    <!-- 高频操作 -->
                    <div class="flex gap-2">
                        <button class="btn flex-1 !py-1.5 text-sm" id="undoBtn">
                            ↩ 悔棋
                        </button>
                        <button class="btn flex-1 !py-1.5 text-sm" id="passBtn">
                            Pass
                        </button>
                    </div>

                    <!-- 棋谱 -->
                    <div
                        class="panel p-3 flex-1 overflow-hidden flex flex-col min-h-0"
                    >
                        <div class="flex items-center justify-between mb-2">
                            <h3
                                class="text-[10px] tracking-[0.3em] text-amber-200/40"
                            >
                                棋谱
                            </h3>
                            <div class="flex items-center gap-2">
                                <span
                                    class="text-xs text-amber-200/40"
                                    id="recordCount"
                                    >0 手</span
                                >
                                <button
                                    id="recordPrevBtn"
                                    class="text-amber-200/30 hover:text-amber-100 text-xs px-1 leading-none"
                                    disabled
                                >
                                    ‹
                                </button>
                                <button
                                    id="recordNextBtn"
                                    class="text-amber-200/30 hover:text-amber-100 text-xs px-1 leading-none"
                                    disabled
                                >
                                    ›
                                </button>
                            </div>
                        </div>
                        <div
                            id="record"
                            class="flex flex-wrap gap-1 overflow-y-auto text-xs leading-relaxed"
                        >
                            <span class="text-amber-200/20">尚无落子...</span>
                        </div>
                    </div>
                </aside>
            </div>

            <footer
                class="mt-8 text-center text-xs text-amber-200/30 tracking-wider"
            >
                古之黑白 · 今之墨弈
            </footer>
        </main>

        <script src="main.js"></script>
    </body>
</html>
